<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé au build par --base-href (voir tool/web/build.sh). -->
  <base href="/respire-iphone/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Respire, version web : accompagnement personnel et confidentiel du sevrage. Vos données restent sur votre appareil.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A1A24">

  <!-- iPhone : « Sur l'écran d'accueil » ouvre Respire en plein écran. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Respire">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Respire</title>

  <style>
    html, body { margin: 0; height: 100%; background: #0A1A24; }
    #chargement {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      color: #CFE7F2; font: 16px/1.4 -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px;
      box-sizing: border-box;
    }
    #chargement img { width: 112px; height: 112px; border-radius: 26px; }
    #chargement .titre { font-size: 22px; font-weight: 600; color: #FFFFFF; }
    #chargement .etat { opacity: .75; }
    #chargement .souffle {
      width: 12px; height: 12px; border-radius: 50%; background: #39C6E6;
      animation: souffle 4s ease-in-out infinite;
    }
    @keyframes souffle { 0%, 100% { transform: scale(1); opacity: .5; }
                         50% { transform: scale(2.4); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #chargement .souffle { animation: none; }
    }
    #chargement .lent { display: none; max-width: 320px; opacity: .85; }
    #chargement.long .lent { display: block; }
    #chargement a { color: #7FDBF0; }
  </style>
</head>
<body>
  <div id="chargement" role="status">
    <img src="icons/Icon-192.png" alt="">
    <div class="titre">Respire</div>
    <div class="souffle" aria-hidden="true"></div>
    <div class="etat">Chargement…</div>
    <div class="lent">
      Le premier chargement peut prendre une minute. Si rien ne s'affiche,
      vérifiez la connexion, mettez l'iPhone à jour, ou revenez à
      <a href="https://exode-respire.netlify.app/telecharger#iphone">la page de téléchargement</a>.
    </div>
  </div>
  <noscript>
    <p style="color:#fff;font-family:sans-serif;padding:24px">
      Respire a besoin de JavaScript pour fonctionner.
    </p>
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var ecran = document.getElementById('chargement');
      if (ecran) ecran.remove();
    });
    setTimeout(function () {
      var ecran = document.getElementById('chargement');
      if (ecran) ecran.className = 'long';
    }, 30000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
